<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 760 320" role="img" aria-label="Browser to the proxy on a VPS, through a WireGuard tunnel to the agent on your device, to your app" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a371f7"/></marker>
    <marker id="srv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#388bfd"/></marker>
    <marker id="dev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
    <marker id="tun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0883e"/></marker>
  </defs>

  <rect x="196" y="56" width="288" height="288" rx="10" fill="#0c2148" stroke="#1f6feb"/>
  <text x="212" y="80" font-weight="700" fill="#388bfd">VPS</text>
  <rect x="532" y="56" width="204" height="288" rx="10" fill="#0d2a17" stroke="#238636"/>
  <text x="548" y="80" font-weight="700" fill="#3fb950">Your device</text>

  <rect x="24" y="96" width="132" height="56" rx="8" fill="#271b44" stroke="#a371f7" stroke-width="1.5"/>
  <text x="90" y="128" text-anchor="middle" font-weight="600" fill="#e2c5ff">Browser</text>
  <rect x="212" y="96" width="256" height="56" rx="8" fill="#1f6feb" stroke="#388bfd" stroke-width="2"/>
  <text x="340" y="128" text-anchor="middle" font-weight="600" fill="#ffffff">Proxy</text>
  <rect x="212" y="184" width="256" height="56" rx="8" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
  <text x="340" y="216" text-anchor="middle" font-weight="600" fill="#cae8ff">WireGuard</text>
  <rect x="212" y="272" width="256" height="56" rx="8" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
  <text x="340" y="304" text-anchor="middle" font-weight="600" fill="#cae8ff">Admin</text>
  <rect x="548" y="96" width="172" height="56" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="634" y="128" text-anchor="middle" font-weight="600" fill="#aff5b4">Agent</text>
  <rect x="548" y="184" width="172" height="56" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="634" y="216" text-anchor="middle" font-weight="600" fill="#aff5b4">WireGuard</text>
  <rect x="548" y="272" width="172" height="56" rx="8" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="634" y="304" text-anchor="middle" font-weight="600" fill="#ffffff">Your app</text>

  <path d="M156 124H210" fill="none" stroke="#a371f7" stroke-width="2" marker-end="url(#web)"/>
  <path d="M340 152V182" fill="none" stroke="#388bfd" stroke-width="1.5" marker-end="url(#srv)"/>
  <path d="M340 272V242" fill="none" stroke="#388bfd" stroke-width="1.5" marker-end="url(#srv)"/>
  <path d="M548 212H470" fill="none" stroke="#f0883e" stroke-width="3" marker-end="url(#tun)"/>
  <path d="M634 152V182" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#dev)"/>
  <path d="M634 240V270" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#dev)"/>
  <text x="183" y="114" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a371f7">HTTPS</text>
  <text x="508" y="202" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f0883e">tunnel</text>
</svg>
