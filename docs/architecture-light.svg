<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 760 320" role="img" aria-label="Browser to the proxy on a VPS, through a WireGuard tunnel to the agent on your device, to your app" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker>
    <marker id="srv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
    <marker id="dev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
    <marker id="tun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bc4c00"/></marker>
  </defs>

  <rect x="196" y="56" width="288" height="288" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="212" y="80" font-weight="700" fill="#0969da">VPS</text>
  <rect x="532" y="56" width="204" height="288" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="548" y="80" font-weight="700" fill="#1a7f37">Your device</text>

  <rect x="24" y="96" width="132" height="56" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="90" y="128" text-anchor="middle" font-weight="600" fill="#3e1f79">Browser</text>
  <rect x="212" y="96" width="256" height="56" rx="8" fill="#0969da" stroke="#0969da" stroke-width="2"/>
  <text x="340" y="128" text-anchor="middle" font-weight="600" fill="#ffffff">Proxy</text>
  <rect x="212" y="184" width="256" height="56" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="340" y="216" text-anchor="middle" font-weight="600" fill="#0a3069">WireGuard</text>
  <rect x="212" y="272" width="256" height="56" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="340" y="304" text-anchor="middle" font-weight="600" fill="#0a3069">Admin</text>
  <rect x="548" y="96" width="172" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="634" y="128" text-anchor="middle" font-weight="600" fill="#033a16">Agent</text>
  <rect x="548" y="184" width="172" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="634" y="216" text-anchor="middle" font-weight="600" fill="#033a16">WireGuard</text>
  <rect x="548" y="272" width="172" height="56" rx="8" fill="#1a7f37" stroke="#1a7f37" stroke-width="2"/>
  <text x="634" y="304" text-anchor="middle" font-weight="600" fill="#ffffff">Your app</text>

  <path d="M156 124H210" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#web)"/>
  <path d="M340 152V182" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#srv)"/>
  <path d="M340 272V242" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#srv)"/>
  <path d="M548 212H470" fill="none" stroke="#bc4c00" stroke-width="3" marker-end="url(#tun)"/>
  <path d="M634 152V182" fill="none" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#dev)"/>
  <path d="M634 240V270" fill="none" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#dev)"/>
  <text x="183" y="114" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8250df">HTTPS</text>
  <text x="508" y="202" text-anchor="middle" font-size="11.5" font-weight="600" fill="#bc4c00">tunnel</text>
