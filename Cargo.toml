[workspace]
resolver = "3"
members = ["crates/proto", "crates/wgctl", "crates/agent", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.92"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
warren-proto = { path = "crates/proto" }
warren-wgctl = { path = "crates/wgctl" }
libc = "0.2"
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
subtle = { version = "2.5", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The agent is size-critical: build it with `--profile agent`.
[profile.agent]
inherits = "release"
opt-level = "z"
