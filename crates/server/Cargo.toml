[package]
name = "warren-server"
description = "Warren server: WireGuard hub, reverse proxy, ACME and web admin in one binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "warren-server"
path = "src/main.rs"

[dependencies]
warren-proto.workspace = true
warren-wgctl.workspace = true
libc.workspace = true
sha2 = { workspace = true, features = ["std"] }
hmac = { workspace = true, features = ["std"] }
x25519-dalek.workspace = true

argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
getrandom = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "rustls-platform-verifier"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }

[target.'cfg(target_os = "linux")'.dependencies]
boringtun = { version = "0.7", default-features = false }

[lints]
workspace = true
